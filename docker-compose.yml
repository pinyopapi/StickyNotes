services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sticky-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src/StickyNotes.Api/stickyNotes.db:/app/stickyNotes.db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - sticky-net
frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "http://backend:8080"
    container_name: sticky-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sticky-net

networks:
  sticky-net:
    driver: bridge
